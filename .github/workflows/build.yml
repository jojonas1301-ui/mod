name: build

on: [pull_request, push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --no-daemon > build-log.txt 2>&1 || true
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: commit log and jar
        if: always()
        run: |
          set +e
          tail -c 400000 build-log.txt > tools/build-log.txt
          mkdir -p releases
          cp build/libs/*.jar releases/ 2>/dev/null
          rm -f releases/*-sources.jar releases/*-dev.jar
          git config user.email "ci@example.com"
          git config user.name "build-ci"
          git add -A tools/build-log.txt releases
          git diff --cached --quiet || git commit -m "chore: build output [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
