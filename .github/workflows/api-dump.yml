name: api-dump

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/**' ]
    paths:
      - '.github/workflows/api-dump.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/dump-request.txt'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: resolve classpath
        run: ./gradlew --no-daemon -q printClasspath > classpath.txt 2>&1 || true
      - name: inspect
        run: |
          set -x
          mkdir -p tools/dump/javap tools/dump/assets
          grep '^CP: ' classpath.txt | sed 's/^CP: //' > jars.txt
          cat jars.txt
          CP=$(paste -sd: jars.txt)
          MCJAR=$(grep -i 'minecraft' jars.txt | grep -vi sources | head -1)
          echo "MCJAR=$MCJAR"
          unzip -l "$MCJAR" | grep '\.class' | awk '{print $4}' | sed 's#/#.#g;s#\.class$##' | sort > tools/dump/mc-classes.txt
          unzip -l "$MCJAR" | grep -E '^.*assets/minecraft/(textures|lang|models)' | awk '{print $4}' | sort > tools/dump/mc-assets.txt
          # fabric api classes
          for j in $(grep -i 'fabric' jars.txt); do unzip -l "$j" 2>/dev/null | grep '\.class' | awk '{print $4}' | sed 's#/#.#g;s#\.class$##' | grep -E '^net\.fabricmc\.fabric\.api' ; done | sort -u > tools/dump/fabric-api-classes.txt
          # requested javap dumps
          for c in $(cat tools/dump-request.txt | tr -d '\r' | grep -v '^#' | grep -v '^$'); do
            f="tools/dump/javap/$(echo $c | tr '.' '_').txt"
            javap -p -classpath "$CP" "$c" > "$f" 2>&1 || true
          done
          # vanilla assets we care about
          unzip -q -o "$MCJAR" 'assets/minecraft/textures/entity/villager/*' -d tools/dump/assets || true
          unzip -q -o "$MCJAR" 'assets/minecraft/textures/entity/piglin/*' -d tools/dump/assets || true
          unzip -q -o "$MCJAR" 'assets/minecraft/lang/en_us.json' -d tools/dump/assets || true
          du -sh tools/dump
      - name: commit dump
        run: |
          git config user.email "ci@example.com"
          git config user.name "api-dump-ci"
          git add -A tools/dump
          git diff --cached --quiet || git commit -m "chore: update api dump [skip ci]"
          git push
